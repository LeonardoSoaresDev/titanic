spring.application.name=titanic

# Settings for database
spring.datasource.url=jdbc:h2:mem:titanicdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false

# Page settings
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Defining the cache implementation and settings
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterAccess=300s

# Uncomment the following properties to see the cache working.
#logging.level.org.springframework.cache=DEBUG
#logging.level.org.springframework.cache.interceptor=TRACE
